<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phasmo Overlay</title>
<meta name="theme-color" content="#0A0D12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  /* Compact view για pin στο Steam overlay (Shift+Tab → Web Browser → pin).
     Σχεδιασμένο για μικρό παράθυρο ~260–360px πλάτος. */
  :root{
    --bg:#0A0D12; --line:#232b38; --muted:#8A93A3; --nv:#8FE388; --warn:#F0C674;
    --nurse:#7FD1C7; --exor:#E2A65B; --runner:#E07A7A; --detect:#9DB8E0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:#D7DCE4}
  html[lang=en] .l-el{display:none!important}
  html:not([lang=en]) .l-en{display:none!important}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.35;padding:10px 12px;min-height:100vh}
  .card{border-top:3px solid var(--c,var(--nv));border-radius:8px;background:#0c1119;padding:10px 12px 12px;max-width:420px}
  .top{display:flex;align-items:center;gap:8px}
  .ic{font-size:20px;line-height:1}
  .name{font-family:"Special Elite","Courier New",monospace;font-size:18px;color:#EAEDF2}
  .role{font-family:"Special Elite",monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--c)}
  .ctl{margin-left:auto;display:flex;gap:4px}
  .ctl button,.ctl a{font:inherit;font-size:11px;background:none;border:1px solid var(--line);border-radius:12px;color:var(--muted);padding:2px 7px;cursor:pointer;text-decoration:none}
  .ctl button:hover,.ctl a:hover{border-color:var(--c);color:var(--c)}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:10px 0 8px}
  .tabs button{font-family:"Special Elite",monospace;font-size:12.5px;letter-spacing:1px;background:#111823;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:5px 4px;cursor:pointer}
  .tabs button.on{border-color:var(--c);color:#0A0D12;background:var(--c)}
  .tabs small{display:block;font-family:system-ui,sans-serif;font-size:10px;letter-spacing:0;opacity:.85}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
  li{display:flex;gap:8px;align-items:baseline}
  li::before{content:"▸";color:var(--c)}
  .it{font-weight:600;color:#EAEDF2;font-size:15px}
  .why{display:block;color:#9aa4b3;font-size:12px;font-weight:400}
  body.compact .why{display:none}
  .note{margin-top:8px;font-size:12px;color:var(--warn);border-left:2px solid #6b5a2a;padding-left:8px}
  .note.keep{color:var(--muted);border-color:var(--line)}
  .hint{margin-top:8px;font-size:10.5px;color:#5b6473}
  /* picker */
  .pick{display:grid;gap:6px;max-width:420px}
  .pick a{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:8px 10px;background:#0c1119;text-decoration:none;color:#EAEDF2;font-family:"Special Elite",monospace;font-size:16px}
  .pick a small{margin-left:auto;font-size:11px;letter-spacing:2px;color:var(--c);text-transform:uppercase}
  .pick a:hover{background:#111823}
  h1{font-family:"Special Elite",monospace;color:var(--nv);font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px;max-width:420px}
  .sub code{color:var(--nv)}
  .all .card{margin-bottom:8px;padding:8px 10px}
  .all .tabs{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
// Ίδια δεδομένα με το team.html (Squad Plan) — κράτα τα συγχρονισμένα αν αλλάξει το πλάνο.
const PLAYERS = {
  paschalia:{name:"Paschalia",role:"Oracle",ic:"🩺",c:"--nurse",
    l1:[["Thermometer","Μισό σπίτι, πιο κρύο room","Half the house, coldest room"],
        ["Spirit Box","Ghost room, φώτα σβηστά","Ghost room, lights off"],
        ["Sound Recorder","Paranormal ήχοι, Moroi / Myling","Paranormal sounds, Moroi / Myling"]],
    l2:[["Sanity Pill ×1","Για όποιον πέσει κάτω από 40%","For whoever drops below 40%"],
        ["Parabolic Microphone","Myling footsteps, Banshee scream","Myling footsteps, Banshee scream"],
        ["Firelight","Στο ghost room","In the ghost room"]],
    swap:["Spirit Box αβέβαιο → κράτα το αντί για Parabolic","Spirit Box unresolved → keep it instead of the Parabolic"]},
  kiki:{name:"Kiki",role:"Detective",ic:"🔎",c:"--detect",
    l1:[["Thermometer","Το άλλο μισό του σπιτιού","The other half of the house"],
        ["Ghost Writing Book","Εκεί που «κάθεται» το ghost","Where the ghost hangs out"],
        ["Crucifix","Κέντρο του ghost room","Center of the ghost room"]],
    l2:[["Motion Sensor ×2","Έξοδοι του ghost room","Ghost room exits"],
        ["Tripod","Για τη Video Camera του Nikos","For Nikos's Video Camera"]],
    swap:["Δεν φάνηκαν Orbs → 2η Video Camera αντί για 2ο sensor","No Orbs yet → 2nd Video Camera instead of the 2nd sensor"],
    keep:["Book + crucifix μένουν στο room · μετά μένεις στο truck","Book + crucifix stay in the room · then you stay in the truck"]},
  markos:{name:"Markos",role:"Scout",ic:"🏃",c:"--runner",
    l1:[["UV Light","Πόρτες, switches, παράθυρα","Doors, switches, windows"],
        ["EMF Reader","Σε κάθε interaction","On every interaction"],
        ["Photo Camera","Φωτογραφία σε κάθε event","Photo on every event"]],
    l2:[["Photo Camera","Ghost photo, bone, cursed item","Ghost photo, bone, cursed item"],
        ["Head Gear","Η Kiki βλέπει τα hunts","Kiki watches the hunts"],
        ["Firelight","Κεριά στη διαδρομή","Candles along your route"]],
    swap:["UV ή EMF ανοιχτό → κράτα το αντί για Firelight","UV or EMF still open → keep it instead of the Firelight"]},
  nikos:{name:"Nikos",role:"Exorcist",ic:"✝️",c:"--exor",
    l1:[["Video Camera","Στραμμένη στο ghost room","Aimed at the ghost room"],
        ["D.O.T.S. Projector","Μέσα στο ghost room","Inside the ghost room"],
        ["Motion Sensor","Στην πόρτα του room","At the room door"]],
    l2:[["Salt","2 σωροί στην πόρτα: Wraith / Gallu","2 piles at the door: Wraith / Gallu"],
        ["Firelight","Γωνίες: Onryo test","Corners: Onryo test"],
        ["Incense","Το μόνο της ομάδας: hunts, smudge","Squad's only one: hunts, smudge"]],
    keep:["Camera, D.O.T.S. και sensor μένουν στημένα","Camera, D.O.T.S. and sensor stay set up"]}
};
const ORDER=["paschalia","kiki","markos","nikos"];
const LS_KEY="phasmo-team-v1", LS_OV="phasmo-overlay-v1";

let lang="en";
try{ const d=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(d && (d.lang==="en"||d.lang==="el")) lang=d.lang; }catch(e){}
let st={stage:1,compact:false};
try{ const d=JSON.parse(localStorage.getItem(LS_OV)||"null"); if(d) st=Object.assign(st,d); }catch(e){}

const qs=new URLSearchParams(location.search);
const pk=(qs.get("player")||"").toLowerCase();
const forcedStage=qs.get("trip");
if(forcedStage==="1"||forcedStage==="2") st.stage=+forcedStage;

const esc=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const t=(el,en)=>`<span class="l-el">${esc(el)}</span><span class="l-en">${esc(en)}</span>`;
function save(){ try{ localStorage.setItem(LS_OV,JSON.stringify(st)); localStorage.setItem(LS_KEY,JSON.stringify({lang})); }catch(e){} }

function itemsHTML(list){
  return "<ul>"+list.map(([it,el,en])=>`<li><span><span class="it">${esc(it)}</span><span class="why">${t(el,en)}</span></span></li>`).join("")+"</ul>";
}
function cardHTML(p,stage,withTabs){
  let h=`<div class="card" style="--c:var(${p.c})">
    <div class="top"><span class="ic">${p.ic}</span><div><div class="name">${esc(p.name)}</div><div class="role">${esc(p.role)}</div></div>`;
  if(withTabs) h+=`<div class="ctl"><button id="lang">${lang==="el"?"EN":"ΕΛ"}</button><button id="cmp" title="Compact">${st.compact?"⊕":"⊖"}</button><a href="overlay.html" title="Άλλος παίκτης / Other player">⇄</a></div>`;
  h+=`</div>`;
  if(withTabs) h+=`<div class="tabs">
      <button data-s="1" class="${stage===1?"on":""}">${t("1ο μπάσιμο","1st trip in")}<small>Loadout 1</small></button>
      <button data-s="2" class="${stage===2?"on":""}">${t("2ο μπάσιμο","2nd trip in")}<small>Loadout 2</small></button></div>`;
  else h+=`<div class="hint" style="margin:4px 0 6px">${stage===1?t("1ο μπάσιμο","1st trip in"):t("2ο μπάσιμο","2nd trip in")}</div>`;
  h+=itemsHTML(stage===1?p.l1:p.l2);
  if(stage===2&&p.swap) h+=`<div class="note">${t(p.swap[0],p.swap[1])}</div>`;
  if(stage===2&&p.keep) h+=`<div class="note keep">${t(p.keep[0],p.keep[1])}</div>`;
  if(withTabs) h+=`<div class="hint">${t("Πλήκτρα: 1 / 2 ή Space για αλλαγή · C compact","Keys: 1 / 2 or Space to switch · C compact")}</div>`;
  return h+"</div>";
}

function render(){
  document.documentElement.setAttribute("lang",lang);
  document.body.classList.toggle("compact",!!st.compact);
  const app=document.getElementById("app");
  const p=PLAYERS[pk];
  if(p){
    document.title=`${p.name} · L${st.stage}`;
    app.innerHTML=cardHTML(p,st.stage,true);
  } else if(pk==="all"){
    document.body.classList.add("all","compact");
    app.innerHTML=`<div class="tabs" style="display:grid;max-width:420px;--c:var(--nv)"><button data-s="1" class="${st.stage===1?"on":""}">${t("1ο μπάσιμο","1st trip in")}</button><button data-s="2" class="${st.stage===2?"on":""}">${t("2ο μπάσιμο","2nd trip in")}</button></div>`
      + ORDER.map(k=>cardHTML(PLAYERS[k],st.stage,false)).join("");
  } else {
    document.title="Phasmo Overlay";
    app.innerHTML=`<h1>OVERLAY</h1>
      <p class="sub">${t("Διάλεξε παίκτη. Μετά στο Steam overlay (Shift+Tab → Web Browser) άνοιξε το link και πάτα το pin.","Pick a player. Then in the Steam overlay (Shift+Tab → Web Browser) open the link and press pin.")}</p>
      <div class="pick">`+ORDER.map(k=>{const q=PLAYERS[k];return `<a href="?player=${k}" style="--c:var(${q.c})"><span>${q.ic}</span>${esc(q.name)}<small>${esc(q.role)}</small></a>`;}).join("")
      +`<a href="?player=all" style="--c:var(--nv)"><span>👥</span>${t("Όλοι","Everyone")}<small>Squad</small></a><a href="timers.html" style="--c:var(--warn)"><span>⏱️</span>Timers<small>Smudge · Hunt · Obambo</small></a></div>
      <p class="sub" style="margin-top:12px"><a href="team.html" style="color:var(--nv)">${t("← Squad Plan","← Squad Plan")}</a> · <button id="lang" style="font:inherit;font-size:12px;background:none;border:1px solid var(--line);border-radius:12px;color:var(--muted);padding:1px 8px;cursor:pointer">${lang==="el"?"EN":"ΕΛ"}</button></p>`;
  }
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{st.stage=+b.dataset.s;save();render();});
  const lb=document.getElementById("lang"); if(lb) lb.onclick=()=>{lang=lang==="el"?"en":"el";save();render();};
  const cb=document.getElementById("cmp"); if(cb) cb.onclick=()=>{st.compact=!st.compact;save();render();};
}
document.addEventListener("keydown",e=>{
  if(!PLAYERS[pk]&&pk!=="all") return;
  if(e.key==="1"||e.key==="2"){st.stage=+e.key;}
  else if(e.key===" "){e.preventDefault();st.stage=st.stage===1?2:1;}
  else if((e.key==="c"||e.key==="C")&&PLAYERS[pk]){st.compact=!st.compact;}
  else return;
  save();render();
});
render();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
